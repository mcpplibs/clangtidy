name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    name: the example builds, and the check actually gates it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings + mcpp
        env:
          # ⚠️ NOT `latest`. This rule needs the release in which mcpp began
          # writing a check's stamp; on anything older the example builds a
          # check whose edge is never satisfied, which does not fail — it just
          # re-runs forever. Pinning is what makes a green run mean something.
          XLINGS_VERSION: '2026.8.27.5'
          MCPP_VERSION: '2026.8.29.1'
        run: |
          set -euo pipefail
          tarball="xlings-${XLINGS_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "/tmp/${tarball}" \
            "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${tarball}"
          tar -xzf "/tmp/${tarball}" -C /tmp
          "/tmp/xlings-${XLINGS_VERSION}-linux-x86_64/subos/default/bin/xlings" self install
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.xlings/subos/current/bin:$PATH"
          xlings install "mcpp@${MCPP_VERSION}" -y
          mcpp --version

      # The package name and the module name must stay EQUAL, and until now
      # nothing enforced that. mcpp < 2026.8.29.1 registers a host module under
      # the dependency's `package.name`; from that release it uses the name the
      # interface declares. Only equality satisfies both engines.
      #
      # ⚠️ AND THE BREAK IS ASYMMETRIC, so a green run on one compiler proves
      # nothing: renaming either alone still builds under GCC, which finds a BMI
      # by its declared name through gcm.cache, while Clang and MSVC are handed
      # an explicit `<name>=<bmi>` mapping built from the registered name and
      # fail. A constraint that lives only in a comment is not a constraint.
      - name: The package name and the module name agree
        run: |
          set -euo pipefail
          toml=mcpp.toml
          iface=src/clangtidy.cppm
          test -f "$toml"  || { echo "FAIL: no $toml";  exit 1; }
          test -f "$iface" || { echo "FAIL: no $iface"; exit 1; }
          # One awk, no pipeline: `... | head -1` would let the writer take
          # SIGPIPE and, under `pipefail`, report 141 for a successful match.
          # Comment lines begin with '#', so neither pattern can match one --
          # this must not be answerable by the prose that explains the rule.
          pkg=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0}
                     p && /^[[:space:]]*name[[:space:]]*=/ {
                         if (match($0, /"[^"]*"/)) {
                             print substr($0, RSTART+1, RLENGTH-2); exit } }' "$toml")
          mod=$(awk '/^[[:space:]]*export[[:space:]]+module[[:space:]]+/ {
                         sub(/^[[:space:]]*export[[:space:]]+module[[:space:]]+/, "")
                         sub(/[[:space:]]*;.*$/, "")
                         print; exit }' "$iface")
          echo "package.name='${pkg}'  export module='${mod}'"
          # Both must be non-empty. An extractor that silently matched nothing
          # would otherwise make this step pass on a file it never parsed.
          [ -n "$pkg" ] || { echo "FAIL: could not read [package].name from $toml"; exit 1; }
          [ -n "$mod" ] || { echo "FAIL: could not read 'export module' from $iface"; exit 1; }
          [ "$pkg" = "$mod" ] || {
              echo "FAIL: package name '$pkg' != module name '$mod'"
              echo "Consumers on mcpp < 2026.8.29.1 import the package name;"
              echo "from 2026.8.29.1 they import the declared name. Keep them equal."
              exit 1; }
          echo "OK: both are '$pkg'"

      - name: Install clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-tidy
          echo "CLANG_TIDY=$(command -v clang-tidy)" >> "$GITHUB_ENV"
          clang-tidy --version | head -2

      - name: The example builds
        working-directory: examples/basic
        run: mcpp build

      # ⚠️ THE CRITERION IS THE STAMP, NOT THE EXIT CODE ABOVE.
      #
      # ninja does not fail when a declared output goes unproduced: it leaves
      # the file absent and re-runs that edge on every build afterwards. So a
      # build in which the stamp mechanism did nothing at all is still green,
      # and the only symptom is work silently redone. Asserting on `mcpp build`
      # succeeding would pass against an engine that has none of this.
      - name: The engine wrote the check's stamp
        working-directory: examples/basic
        run: |
          set -euo pipefail
          n=$(find target -name '*.stamp' | wc -l)
          find target -name '*.stamp' | sed 's/^/  /'
          [ "$n" = "1" ] || { echo "expected exactly one stamp, found $n"; exit 1; }

      - name: A finding fails the build
        working-directory: examples/basic
        run: |
          set -uo pipefail
          # clang-tidy exits 0 while reporting a diagnostic; the rule turns
          # warnings into errors by default, and this is what proves it.
          cat > src/main.cpp <<'EOF'
          #include <cstdio>
          #include <cstring>
          int main() {
              char buf[4];
              std::memcpy(buf, "hello", 5);   // bugprone-not-null-terminated-result
              std::printf("%s\n", buf);
          }
          EOF
          if mcpp build > out.log 2>&1; then
              cat out.log
              echo "FAIL: a real clang-tidy finding did not fail the build"
              exit 1
          fi
          grep -qi 'not null-terminated' out.log || {
              cat out.log
              echo "FAIL: the build failed without reporting what the check found"
              exit 1; }
          echo "OK: the finding gated the build"
